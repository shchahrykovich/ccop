[workspace]
# Listed one by one: a glob such as apps/* would also match apps/menubar,
# which is a Swift package with no Cargo.toml.
members = ["apps/cli", "libs/core"]
resolver = "3"

[workspace.package]
version = "0.3.3"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
ccop-core = { path = "libs/core" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
